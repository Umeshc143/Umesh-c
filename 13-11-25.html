<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label from="name">name</label>
    <input type="text" required pattern="{>18,}"><br>
    <br>
    <label from="age">Age</label>
    <input type="number"><br>
    <br>
    <label for="email_id">email</label>
    <input type="email" id="email" required pattern="[A-Za-z]+@[a-z0-9.-]+\.[a-z]"
        title="Please enter a valid email address."><br>
        <br>
        <label for="password">password</label>
    <input type="password" id="password" name="password" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
        title="Password must be at least 8 characters long and include at least one uppercase letter, one lowercase letter, and one number."><br>
        <br>
        <button type="submit">Submit</button><br>
        <title>in Valid email_id</title>
</body>
</html>
